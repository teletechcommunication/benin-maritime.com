<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benin Maritime — Vessel Documentation</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f1f4f8; color: #1a2b3c; }
  header { background: #0f2a44; color: #fff; padding: 20px; text-align: center; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  header p { margin: 6px 0 0; opacity: .75; font-size: 14px; }
  header a { color: #fff; text-decoration: none; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
  .vessel { margin-top: 28px; }
  .vessel h2 { font-size: 18px; border-bottom: 2px solid #0f2a44; padding-bottom: 6px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; text-decoration: none; color: inherit; border: 1px solid #dbe3ec; display: block; }
  .card:hover { border-color: #0f2a44; box-shadow: 0 2px 10px rgba(15,42,68,.12); }
  .card .code { display: inline-block; font-size: 12px; font-weight: 700; background: #0f2a44; color: #fff; border-radius: 5px; padding: 3px 8px; margin-bottom: 8px; }
  .card .title { font-weight: 600; font-size: 15px; line-height: 1.35; word-break: break-word; }
  .card .url { font-size: 12px; color: #5b7288; margin-top: 8px; word-break: break-all; }
  .viewer-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .viewer-top h2 { margin: 0; font-size: 20px; }
  .viewer-top .slug { font-size: 13px; color: #5b7288; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
  .btn { display: inline-block; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; border: 1px solid #0f2a44; }
  .btn.primary { background: #0f2a44; color: #fff; }
  .btn.ghost { background: #fff; color: #0f2a44; }
  iframe.pdf { width: 100%; height: 78vh; border: 1px solid #dbe3ec; border-radius: 10px; background: #525659; }
  .notfound { background: #fff; border: 1px solid #dbe3ec; border-radius: 10px; padding: 30px; text-align: center; }
  footer { text-align: center; font-size: 12px; color: #8496a8; padding: 20px; }
</style>
</head>
<body>
<header>
  <h1><a href="/">Benin Maritime</a></h1>
  <p>Vessel Documentation</p>
</header>
<main id="app"></main>
<footer>benin-maritime.com</footer>
<script>
(function () {
  var DOCS = [
    { slug: "berg-1-bma-10205-cor", file: "BERG 1 - BMA-10205-COR.pdf", vessel: "BERG 1", label: "COR" },
    { slug: "berg-1-bma-10205-itc", file: "BERG 1 - BMA-10205-ITC.pdf", vessel: "BERG 1", label: "ITC" },
    { slug: "berg-1-bma-10205-msm", file: "BERG 1 - BMA-10205-MSM.pdf", vessel: "BERG 1", label: "MSM" },
    { slug: "berg-1-bma-10205-srl", file: "BERG 1 - BMA-10205-SRL.pdf", vessel: "BERG 1", label: "SRL" },
    { slug: "hornet-bma-10156-cor", file: "HORNET - BMA-10156-COR.pdf", vessel: "HORNET", label: "COR" },
    { slug: "hornet-bma-10156-itc", file: "HORNET - BMA-10156-ITC.pdf", vessel: "HORNET", label: "ITC" },
    { slug: "hornet-bma-10156-msm", file: "HORNET - BMA-10156-MSM.pdf", vessel: "HORNET", label: "MSM" },
    { slug: "hornet-bma-10156-srl", file: "HORNET - BMA-10156-SRL.pdf", vessel: "HORNET", label: "SRL" }
  ];

  function pdfUrl(file) { return "/pdfs/" + encodeURIComponent(file); }
  function pageUrl(slug) { return "/" + slug; }

  function currentSlug() {
    var p = window.location.pathname.replace(/^\/+|\/+$/g, "");
    p = p.split("/")[0] || "";
    try { p = decodeURIComponent(p); } catch (e) {}
    return p.toLowerCase();
  }

  function findDoc(slug) {
    for (var i = 0; i < DOCS.length; i++) {
      if (DOCS[i].slug === slug) return DOCS[i];
    }
    return null;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderHome() {
    document.title = "Benin Maritime — Vessel Documentation";
    var vessels = {};
    DOCS.forEach(function (d) { (vessels[d.vessel] = vessels[d.vessel] || []).push(d); });
    var html = "";
    Object.keys(vessels).sort().forEach(function (v) {
      html += '<section class="vessel"><h2>' + esc(v) + '</h2><div class="grid">';
      vessels[v].forEach(function (d) {
        var name = d.vessel + " - " + d.file.split(" - ")[1].replace(/\.pdf$/i, "");
        html += '<a class="card" href="' + pageUrl(d.slug) + '">'
          + '<span class="code">' + esc(d.label) + '</span>'
          + '<div class="title">' + esc(name) + '</div>'
          + '<div class="url">benin-maritime.com/' + esc(d.slug) + '</div>'
          + '</a>';
      });
      html += "</div></section>";
    });
    document.getElementById("app").innerHTML = html;
  }

  function renderDoc(doc) {
    var base = doc.file.replace(/\.pdf$/i, "");
    document.title = base + " — Benin Maritime";
    var url = pdfUrl(doc.file);
    document.getElementById("app").innerHTML =
      '<div class="viewer-top"><div><h2>' + esc(base) + '</h2>'
      + '<div class="slug">benin-maritime.com/' + esc(doc.slug) + '</div></div></div>'
      + '<div class="btn-row">'
      + '<a class="btn ghost" href="/">← All documents</a>'
      + '<a class="btn primary" href="' + url + '" download>Download PDF</a>'
      + '<a class="btn ghost" href="' + url + '" target="_blank" rel="noopener">Open raw file</a>'
      + '</div>'
      + '<iframe class="pdf" src="' + url + '" title="' + esc(base) + '"></iframe>';
  }

  function renderNotFound(slug) {
    document.title = "Not found — Benin Maritime";
    document.getElementById("app").innerHTML =
      '<div class="notfound"><h2>Document not found</h2>'
      + '<p>No document matches <code>/' + esc(slug) + '</code>.</p>'
      + '<p><a class="btn primary" href="/">View all documents</a></p></div>';
  }

  // Intercept internal clicks so clean URLs work without reload setup
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a") : null;
    if (!a) return;
    var href = a.getAttribute("href");
    if (!href || href.charAt(0) !== "/" || href.indexOf("/pdfs/") === 0) return;
    if (a.target === "_blank") return;
    e.preventDefault();
    history.pushState(null, "", href);
    route();
  });
  window.addEventListener("popstate", route);

  function route() {
    var slug = currentSlug();
    if (!slug) { renderHome(); return; }
    var doc = findDoc(slug);
    if (doc) { renderDoc(doc); return; }
    renderNotFound(slug);
  }

  route();
})();
</script>
</body>
</html>
