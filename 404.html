<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benin Maritime</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #525659; }
  #pages { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0; }
  #pages img { display: block; width: 100%; max-width: 1000px; height: auto; background: #fff;
        box-shadow: 0 1px 4px rgba(0,0,0,.4); -webkit-user-drag: none; user-select: none; }
  embed.pdf, iframe.pdf { display: block; width: 100vw; height: 100vh; border: 0; background: #525659; }
</style>
</head>
<body oncontextmenu="return false">
<div id="app"></div>
<script>
(function () {
  var DOCS = {
    "berg-1-bma-10205-cor": "BERG 1 - BMA-10205-COR.pdf",
    "berg-1-bma-10205-itc": "BERG 1 - BMA-10205-ITC.pdf",
    "berg-1-bma-10205-msm": "BERG 1 - BMA-10205-MSM.pdf",
    "berg-1-bma-10205-srl": "BERG 1 - BMA-10205-SRL.pdf",
    "hornet-bma-10156-cor": "HORNET - BMA-10156-COR.pdf",
    "hornet-bma-10156-itc": "HORNET - BMA-10156-ITC.pdf",
    "hornet-bma-10156-msm": "HORNET - BMA-10156-MSM.pdf",
    "hornet-bma-10156-srl": "HORNET - BMA-10156-SRL.pdf"
  };

  function currentSlug() {
    var p = window.location.pathname.replace(/^\/+|\/+$/g, "").split("/")[0] || "";
    try { p = decodeURIComponent(p); } catch (e) {}
    return p.toLowerCase();
  }

  var slug = currentSlug();
  var app = document.getElementById("app");

  if (!slug) {
    // Original homepage — unchanged previous document
    document.title = "Benin Maritime";
    app.innerHTML = '<div id="pages"><img src="/page-1.jpg" alt="Benin Maritime" draggable="false"></div>';
  } else if (DOCS[slug]) {
    // Clean URL — show just that PDF, nothing else
    var file = DOCS[slug];
    document.title = file.replace(/\.pdf$/i, "");
    var url = "/pdfs/" + encodeURIComponent(file);
    app.innerHTML = '<embed class="pdf" src="' + url + '" type="application/pdf">';
  } else {
    document.title = "Not found";
    app.innerHTML = '<p style="color:#fff;font-family:sans-serif;text-align:center;padding:40px;">Not found</p>';
  }
})();
</script>
</body>
</html>
